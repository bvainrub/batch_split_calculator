<style>
  :root {
    --bg: #ffffff; --tint: #f3f2fb; --line: #d8d5ee;
    --name: #2a2083; --title: #392cb5; --text: #000000; --warn: #8a2b00; --warn-bg: #fdeee6;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
    font-size: 10pt; font-weight: 400; line-height: 1.55; padding: 24px 16px 40px;
  }
  main { max-width: 540px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
           padding-bottom: 14px; border-bottom: 3px solid var(--name); margin-bottom: 20px; }
  header img { height: 56px; width: auto; display: block; }
  h1 { font-size: 14pt; font-weight: 600; color: var(--name); margin: 0; line-height: 1.2; }

  section { margin-bottom: 18px; }
  h2 { font-size: 11pt; font-weight: 500; color: var(--title); margin: 0 0 8px;
       padding-left: 10px; border-left: 4px solid var(--title); line-height: 1.2; }
  .panel { background: var(--tint); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }

  label { display: block; margin-bottom: 4px; }
  input, select { width: 100%; font: inherit; font-size: 11pt; padding: 9px 12px; margin-bottom: 14px;
          background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 9px 18px; cursor: pointer;
           background: var(--name); color: #fff; border: 0; border-radius: 4px; }
  button:hover { background: var(--title); }
  button.secondary { background: #fff; color: var(--name); border: 1px solid var(--name); margin-left: 8px; }
  button.secondary:hover { background: var(--tint); }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 0; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

  .result { background: #fff; border: 2px solid var(--name); }
  .result p { margin: 0; padding: 8px 0; font-weight: 600; font-size: 11pt; color: var(--name); }
  .result p + p { border-top: 1px solid var(--line); }
  .result p.grp { padding-top: 18px; }
  .red { color: red; }
  .green { color: green; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 12px; font-weight: 600; }
  .error { color: var(--warn); font-weight: 600; margin: 12px 0 0; }
  [hidden] { display: none; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tab { font: inherit; font-size: 11pt; font-weight: 500; color: var(--title); background: transparent;
         border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 8px 14px; margin-bottom: -1px; }
  .tab:hover { background: var(--tint); }
  .tab[aria-selected="true"] { color: var(--name); font-weight: 600; border-bottom-color: var(--name); }
  .result .warn { margin-bottom: 8px; }
  .hint { margin: 0 0 10px; }
</style>
</head>

<script>
  const MAX_BATCH_WEIGHT = 5010; // gr
  const $ = id => document.getElementById(id);
  const fmt = (n, d = 3) => n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: d });

  function calculate() {
    const factor = parseFloat($("factor").value);
    const weight = parseFloat($("weight").value);
    const err = $("err");
    err.hidden = true;

    if (!(factor > 0) || !(weight > 0)) {
      err.textContent = "Enter both values as numbers greater than 0.";
      err.hidden = false;
      $("out").hidden = true;
      return;
    }

    const total = factor * weight;
    const rows = [["Total weight (factor x weight)", fmt(factor) + " x " + fmt(weight) + " = " + fmt(total) + " gr"]];
    let html = "";

    if (total <= MAX_BATCH_WEIGHT) {
      rows.push(
        ["Limit per batch", fmt(MAX_BATCH_WEIGHT) + " gr"],
        ["Batches (n)", "1 (total <= limit)"]
      );
      html = '<div class="warn">Only one batch with factor: ' + fmt(factor) + "</div>";
    } else {
      const ratio = total / MAX_BATCH_WEIGHT;
      const batches = Math.ceil(ratio);
      const perBatch = Math.ceil(factor / batches);
      const fullCount = Math.floor(factor / perBatch);
      const remainder = factor - perBatch * fullCount;

      rows.push(
        ["Limit per batch", fmt(MAX_BATCH_WEIGHT) + " gr"],
        ["Batches (n)", fmt(total) + " / " + fmt(MAX_BATCH_WEIGHT) + " = " + fmt(ratio, 2) + " \u2192 " + batches],
        ["Factor per batch", fmt(factor) + " / " + batches + " = " + fmt(factor / batches, 2) + " \u2192 " + perBatch],
        ["Full batches x factor", fullCount + " x " + perBatch + " = " + fmt(fullCount * perBatch)],
        ["Remaining factor", fmt(factor) + " - " + fmt(fullCount * perBatch) + " = " + fmt(remainder)],
        ["Test (sum of factors)", fullCount + " x " + perBatch + (remainder > 0 ? " + " + fmt(remainder) : "") + " = " +
          fmt(fullCount * perBatch + remainder)]
      );

      html = "<p>Make " + fullCount + " batch" + (fullCount > 1 ? "es" : "") +
             " with Product Sizing Factor: " + perBatch + "</p>";
      if (remainder > 0) {
        html += "<p>Make 1 batch with Product Sizing Factor: " + fmt(remainder) + "</p>";
      }
    }

    $("steps").innerHTML = rows.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
    $("result").innerHTML = html;
    $("out").hidden = false;
  }

  $("calc").addEventListener("click", calculate);
  $("reset").addEventListener("click", () => {
    $("factor").value = ""; $("weight").value = "";
    $("out").hidden = true; $("err").hidden = true;
    $("factor").focus();
  });

  /* ---------- Base Split ---------- */
  const MAX_CAPS_PER_BATCH = 15000;
  const MAX_BASE_BATCH = 5010; // gr per compounding batch

  function updateBatchInputs() {
    const onHand = parseFloat($("s-onhand").value) || 0;
    const same = $("s-same").value === "yes";
    const unit = parseFloat($(same ? "s-baseqty" : "s-newunit").value);
    const psf = parseFloat($("s-psf").value);
    const wrap = $("s-batches-wrap"), box = $("s-batch-inputs");
    const prev = Array.from(box.querySelectorAll("input")).map(i => i.value);
    const needNew = psf * unit - onHand;
    if (!(unit > 0) || !(psf > 0) || !(needNew > 0)) { wrap.hidden = true; box.innerHTML = ""; return; }
    const k = Math.ceil(needNew / MAX_BASE_BATCH - 1e-9);
    const hint = Math.ceil(needNew / k);
    $("s-batches-hint").textContent = "New base needed: " + fmt(needNew) + " gr. At max " + fmt(MAX_BASE_BATCH, 0) +
      " gr per batch: " + k + " new batch" + (k > 1 ? "es" : "") + ".";
    let h = "";
    for (let i = 1; i <= k; i++) {
      h += '<label for="s-b' + i + '">New Batch ' + i + ' Amount (gr)</label>' +
           '<input id="s-b' + i + '" type="number" inputmode="decimal" min="0" max="' + MAX_BASE_BATCH + '" step="any" placeholder="' + hint + '">';
    }
    box.innerHTML = h;
    prev.forEach((v, i) => { const el = $("s-b" + (i + 1)); if (el) el.value = v; });
    wrap.hidden = false;
  }

  function calculateSplit() {
    const onHand = parseFloat($("s-onhand").value);
    const baseQty = parseFloat($("s-baseqty").value);
    const psf = parseFloat($("s-psf").value);
    const caps = parseFloat($("s-caps").value);
    const same = $("s-same").value === "yes";
    const newUnitVal = parseFloat($("s-newunit").value);
    const unit = same ? baseQty : newUnitVal;   // unit size for totals, split sizes and batch amounts
    const unitLabel = same ? "Old Base Quantity per unit" : "New Base Quantity per Unit";
    // Boris's rule, NO mode only: if the old base on hand is more than one old unit,
    // the first split's RDD is calculated with the average of the old and new unit sizes.
    const avgApplies = !same && onHand > baseQty;
    const rddUnit = avgApplies ? (baseQty + newUnitVal) / 2 : unit;
    const err = $("s-err");
    err.hidden = true;
    $("s-out").hidden = true;
    $("s-usage-sec").hidden = true;
    $("s-comp-sec").hidden = true;
    updateBatchInputs();

    const fail = msg => { err.textContent = msg; err.hidden = false; };
    if (!(onHand >= 0) || !(unit > 0) || !(psf > 0) || !(caps > 0)) {
      return fail("Enter all required values. Unit size, PSF and caps must be greater than 0.");
    }
    if (!Number.isInteger(psf)) return fail("Product Sizing Factor must be an integer.");

    const maxPsf = Math.floor(MAX_CAPS_PER_BATCH / caps);
    const maxPsfWeight = Math.floor(MAX_BASE_BATCH / unit);

    const nsRaw = $("s-nsplits").value.trim();
    let manualN = null;
    if (nsRaw !== "") {
      const v = Number(nsRaw);
      if (!Number.isInteger(v) || v < 1) return fail("Manual adjust # of splits must be a positive integer, or leave it empty for automatic.");
      if (v > psf) return fail("Manual adjust # of splits (" + v + ") cannot be more than PSF (" + psf + "): each split needs at least PSF 1.");
      manualN = v;
    }
    if (manualN === null) {
      if (maxPsf < 1) return fail("Order quantity exceeds " + fmt(MAX_CAPS_PER_BATCH, 0) + " caps; a single PSF unit cannot fit in a batch.");
      if (maxPsfWeight < 1) return fail("One PSF unit (" + fmt(unit) + " gr) exceeds the base limit per split (" + fmt(MAX_BASE_BATCH, 0) + " gr). Set the number of splits yourself if you want to proceed anyway.");
    }

    const totalCaps = psf * caps;
    const n = manualN !== null ? manualN : Math.max(Math.ceil(totalCaps / MAX_CAPS_PER_BATCH), Math.ceil(psf / maxPsf), Math.ceil(psf / maxPsfWeight));
    const basePsf = Math.floor(psf / n);
    const rem = psf % n;
    const batches = [];
    for (let i = 0; i < n; i++) batches.push(basePsf + (i < rem ? 1 : 0));

    const value1 = psf * unit;               // total base needed for the order (gr)
    const rddOld = onHand / (rddUnit * psf);
    const rddNew = 1 - rddOld;
    const needNew = value1 - onHand;            // new base required (gr)
    const enough = needNew <= 1e-9;             // old base on hand covers the whole order
    const k = needNew > 0 ? Math.ceil(needNew / MAX_BASE_BATCH - 1e-9) : 0;   // new batches required
    const amounts = [];
    for (let i = 1; i <= k; i++) { const el = $("s-b" + i); amounts.push(el ? parseFloat(el.value) : NaN); }
    if (amounts.some(a => !(a > 0) || a > MAX_BASE_BATCH)) {
      return fail("Enter an amount for each new batch (greater than 0, max " + fmt(MAX_BASE_BATCH, 0) + " gr).");
    }
    const newTotal = amounts.reduce((a, b) => a + b, 0);

    // Per-split breakdown. "Old" for a split = base already on hand when the split starts:
    // the old base for split 1, the leftover of the previous batch for later splits.
    // "New" = base taken from a batch first opened during that split.
    const splitInfo = [];
    {
      const sources = [{ name: "Old base", amount: onHand, opened: true }];
      amounts.forEach((a, i) => sources.push({ name: "Batch " + (i + 1), amount: a, opened: false }));
      batches.forEach(b => {
        let need = b * unit;
        const parts = [];
        let oldGr = 0, newGr = 0;
        const onHandSrc = sources.find(src => src.opened && src.amount > 1e-9) || null;
        while (need > 1e-9 && sources.length) {
          const src = sources[0];
          if (src.amount <= 1e-9) { sources.shift(); continue; }
          const used = Math.min(src.amount, need);
          parts.push(src.name + " " + fmt(used) + " gr");
          if (src === onHandSrc) oldGr += used; else newGr += used;
          src.opened = true;
          src.amount -= used; need -= used;
          if (src.amount <= 1e-9) sources.shift();
        }
        if (need > 1e-9) parts.push("missing " + fmt(need) + " gr");
        const total = b * unit;
        splitInfo.push({ psf: b, caps: b * caps, total, parts, oldGr, newGr,
          rddOld: total > 0 ? oldGr / total : 0, rddNew: total > 0 ? newGr / total : 0 });
      });
    }
    // Boris's rule: in NO mode with the average in effect, Split 1's RDD in the Result uses the
    // average unit size, exactly as in the Calculation section; splits 2+ keep the gram-based
    // values calculated with the new unit size only.
    if (splitInfo.length && splitInfo[0].newGr > 1e-9) {
      // Split 1 in the Result repeats the first-split RDD pair from the Calculation section
      // unchanged, in every mode: RDD old = on hand / (RDD unit size x total PSF),
      // RDD new = 1 - RDD old. Splits 2+ keep their gram-based per-split values.
      splitInfo[0].rddOld = rddOld;
      splitInfo[0].rddNew = rddNew;
      splitInfo[0].rddDp = 5;   // shown with the same precision as in the Calculation section
    }

    const rows = [
      ["Limit per batch", fmt(MAX_CAPS_PER_BATCH, 0) + " caps"],
      ["Base weight limit per split", fmt(MAX_BASE_BATCH, 0) + " gr"],
      ["Max PSF per batch", "floor(" + fmt(MAX_CAPS_PER_BATCH, 0) + " / " + fmt(caps) + ") = " + fmt(maxPsf, 0)],
      ["Max PSF per split (by weight)", "floor(" + fmt(MAX_BASE_BATCH, 0) + " / " + fmt(unit) + ") = " + fmt(maxPsfWeight, 0)],
      ["Total caps (PSF x order caps)", fmt(psf, 0) + " x " + fmt(caps) + " = " + fmt(totalCaps)]
    ];
    if (n > 1) {
      rows.push(["Base PSF per batch", "floor(" + psf + " / " + n + ") = " + basePsf + (manualN !== null ? " (splits set manually)" : "")]);
      [...new Set(batches)].sort((a, b) => a - b).forEach(b => {
        rows.push(["Base per split (PSF " + b + ")", b + " x " + fmt(unit) + " = " + fmt(b * unit) + " gr"]);
      });
    }
    if (enough) {
      rows.push(
        ["Total weight needed (PSF x " + unitLabel + ")", psf + " x " + fmt(unit) + " = " + fmt(value1) + " gr"],
        ["On Hand from Old Base", fmt(onHand) + " gr"],
        ["Old base on hand is enough", fmt(onHand) + " >= " + fmt(value1) + " gr"],
        ["Old base left over", fmt(onHand) + " - " + fmt(value1) + " = " + fmt(onHand - value1) + " gr"]
      );
    } else {
    rows.push(
      ["First Split with Old base amount:", ""],
      ...(avgApplies ? [["<span class=\"red\">Unit size for first split (average)</span>", "<span class=\"red\">(" + fmt(baseQty) + " + " + fmt(newUnitVal) + ") / 2 = " + fmt(rddUnit) + "</span>"]] : []),
      ["RDD (old base)", fmt(onHand) + " / (" + fmt(rddUnit) + " x " + psf + ") = " + fmt(rddOld, 5)],
      ["RDD (new base)", "1 - " + fmt(rddOld, 5) + " = " + fmt(rddNew, 5)]
    );
    rows.push(
      ["Total weight needed (PSF x " + unitLabel + ")", psf + " x " + fmt(unit) + " = " + fmt(value1) + " gr"],
      ["On Hand from Old Base", fmt(onHand) + " gr"],
      ["Requested weight from new batches", fmt(value1) + " - " + fmt(onHand) + " = " + fmt(Math.max(needNew, 0)) + " gr"],
      ["New batches required (max " + fmt(MAX_BASE_BATCH, 0) + " gr each)", k]
    );
    if (k > 0) {
      rows.push(["New batch amounts entered", amounts.map(a => fmt(a)).join(" + ") + " = " + fmt(newTotal) + " gr"]);
    }
    }

    let html = "";
    if (k > 0 && onHand + newTotal < value1 - 1e-9) {
      html += '<div class="warn">Old base on hand plus new batches is short by ' + fmt(value1 - onHand - newTotal) + ' gr.</div>';
    }
    if (manualN !== null) {
      [...new Set(batches)].sort((a, b) => a - b).forEach(b => {
        if (b * unit > MAX_BASE_BATCH + 1e-9) html += '<div class="warn">Split weight ' + fmt(b * unit) + " gr (PSF " + b + ") is above the " + fmt(MAX_BASE_BATCH, 0) + " gr limit.</div>";
        if (b * caps > MAX_CAPS_PER_BATCH) html += '<div class="warn">Split caps ' + fmt(b * caps) + " (PSF " + b + ") is above the " + fmt(MAX_CAPS_PER_BATCH, 0) + " caps limit.</div>";
      });
    }
    let hasRdd = false;
    if (n > 1) {
      splitInfo.forEach((si, i) => {
        html += "<p" + (i > 0 ? ' class="grp"' : "") + ">Split " + (i + 1) + ":</p>";
        html += "<p>Requested Daily Dose (RDD old base): " + fmt(si.rddOld, si.rddDp || 4) + "</p>";
        if (si.newGr <= 1e-9 && Math.abs(si.oldGr - si.total) < 1e-6) {
          html += "<p>Note you have enough to complete order from new lot</p>";
        } else {
          html += "<p>Requested Daily Dose (RDD new base): " + fmt(si.rddNew, si.rddDp || 4) + "</p>";
        }
      });
      hasRdd = true;
    } else if (!enough) {
      html += "<p>Requested Daily Dose (RDD old base): " + fmt(rddOld, 4) + "</p>";
      html += "<p>Requested Daily Dose (RDD new base): " + fmt(rddNew, 4) + "</p>";
      hasRdd = true;
    }
    html += "<p" + (hasRdd ? ' class="grp"' : "") + ">For Capsule release:</p>";
    const groups = {};
    batches.forEach(b => { groups[b] = (groups[b] || 0) + 1; });
    Object.keys(groups).map(Number).sort((a, b) => a - b).forEach(b => {
      html += "<p>Make " + groups[b] + " batch with Product Sizing Factor " + b + " (" + fmt(b * caps) + " caps)</p>";
    });

    $("s-steps").innerHTML = rows.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
    $("s-result").innerHTML = html;

    if (k >= 2) {
      let remaining = Math.max(needNew, 0);
      const u = [["New base needed", fmt(needNew) + " gr"]];
      const usedList = [];
      amounts.forEach(a => {
        const used = Math.min(a, remaining);
        remaining -= used;
        usedList.push(used);
      });
      // Only the last batch that was actually used can hold the order's leftover: highlight it green.
      let lastLeftIdx = -1;
      usedList.forEach((used, i) => { if (used > 1e-9 && amounts[i] - used > 1e-9) lastLeftIdx = i; });
      amounts.forEach((a, i) => {
        const left = a - usedList[i];
        const leftTxt = i === lastLeftIdx ? '<span class="green">left over ' + fmt(left) + " gr</span>" : "left over " + fmt(left) + " gr";
        u.push(["Batch " + (i + 1) + " (" + fmt(a) + " gr)", "used " + fmt(usedList[i]) + " gr, " + leftTxt]);
      });
      if (remaining > 1e-9) u.push(["Still missing", fmt(remaining) + " gr"]);
      $("s-usage").innerHTML = u.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
      $("s-usage-sec").hidden = false;
    }

    if (n > 1) {
      const comp = splitInfo.map((si, i) => [
        "Split " + (i + 1) + " (PSF " + si.psf + ", Caps " + si.caps + ")",
        si.parts.join(" + ")
      ]);
      $("s-comp").innerHTML = comp.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
      $("s-comp-sec").hidden = false;
    }
    $("s-out").hidden = false;
  }

  $("s-same").addEventListener("change", () => {
    const yes = $("s-same").value === "yes";
    $("s-newunit-wrap").hidden = yes;
    $("s-oldunit-wrap").hidden = false;   // Old Base Quantity per unit always stays visible: in NO mode it is needed for the first-split average
    updateBatchInputs();
  });
  ["s-onhand", "s-baseqty", "s-psf", "s-newunit"].forEach(id => $(id).addEventListener("input", updateBatchInputs));
  $("s-calc").addEventListener("click", calculateSplit);
  $("s-reset").addEventListener("click", () => {
    ["s-onhand", "s-baseqty", "s-psf", "s-caps", "s-newunit", "s-nsplits"].forEach(id => $(id).value = "");
    $("s-same").value = "yes"; $("s-newunit-wrap").hidden = true; $("s-oldunit-wrap").hidden = false;
    updateBatchInputs();
    $("s-out").hidden = true; $("s-usage-sec").hidden = true; $("s-comp-sec").hidden = true; $("s-err").hidden = true;
    $("s-onhand").focus();
  });

  /* ---------- Tabs ---------- */
  let activeTab = "batch";
  function showTab(name) {
    activeTab = name;
    ["batch", "base"].forEach(k => {
      $("tab-" + k).hidden = (k !== name);
      $("t-" + k).setAttribute("aria-selected", k === name ? "true" : "false");
    });
  }
  $("t-batch").addEventListener("click", () => showTab("batch"));
  $("t-base").addEventListener("click", () => showTab("base"));
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (activeTab === "batch") calculate(); else calculateSplit();
  });
</script>
</body>
</html>
